<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Visual Store Theme (V03)</title>
    <!-- Kết nối external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="store-container">
        <!-- Header / Navbar -->
        <header class="navbar">
            <div class="brand">TECH / STORE</div>
            <nav class="nav-links">
                <a href="#products">Sản phẩm</a>
                <a href="#deals">Ưu đãi</a>
                <a href="#support">Hỗ trợ</a>
            </nav>
            <button class="btn-cart">Giỏ hàng</button>
        </header>

        <!-- Hero Banner -->
        <section class="hero-banner">
            <span class="badge-tag">NEW COLLECTION</span>
            <h1 class="hero-title">
                Gear tốt hơn.<br>
                Học tập tập trung hơn.
            </h1>
            <p class="hero-desc">Thiết bị được chọn cho góc làm việc của sinh viên công nghệ.</p>
            <button class="btn-primary">Khám phá sản phẩm</button>
        </section>

        <!-- Danh sách sản phẩm nổi bật -->
        <section class="featured-section" id="products">
            <h2 class="section-title">Sản phẩm nổi bật</h2>

            <div class="product-list">
                <!-- Card 1 -->
                <article class="product-card">
                    <div class="product-info">
                        <h3 class="product-name">Nova Keyboard</h3>
                        <p class="product-price">1.290.000đ</p>
                    </div>
                    <div class="product-thumb">
                        <span class="product-icon">⌨️</span>
                    </div>
                </article>

                <!-- Card 2 -->
                <article class="product-card">
                    <div class="product-info">
                        <h3 class="product-name">Pulse Headphones</h3>
                        <p class="product-price">890.000đ</p>
                    </div>
                    <div class="product-thumb">
                        <span class="product-icon">🎧</span>
                    </div>
                </article>
            </div>
        </section>
    </div>
</body>

</html>
